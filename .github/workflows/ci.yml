name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Install
        run: uv sync --python ${{ matrix.python-version }}
      - name: Test
        run: uv run pytest -q
      - name: Demo transcript (smoke test of the real server)
        run: uv run python scripts/demo_client.py > /dev/null
