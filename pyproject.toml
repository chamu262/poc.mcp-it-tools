[project]
name = "mcp-it-tools"
version = "0.1.0"
description = "A read-only MCP server that gives AI agents safe IT tools over demo data."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "chamu262" }]
requires-python = ">=3.10"
dependencies = ["mcp>=1.10"]

[project.scripts]
mcp-it-tools = "mcp_it_tools.server:main"
mcp-it-viewer = "mcp_it_tools.viewer:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_it_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
